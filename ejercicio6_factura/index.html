<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Factura</title>
</head>
<body>
    <h1>Emitir factura</h1>
    <form action="factura.php" method="post">
        <p>Descripción del artículo: <input type="text" name="descripcion" required></p>
        <p>Cantidad: <input type="number" name="cantidad" min="1" value="1" required></p>
        <p>Precio unitario ($): <input type="number" name="precio" min="0" step="0.01" required></p>
        <button type="submit">Facturar</button>
    </form>
</body>
</html>
